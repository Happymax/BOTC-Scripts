# Townsfolk Roles
- id: townsfolk1
  name: 镇民1
  edition: tf1
  image: https://release.botc.app/resources/characters/generic/good.webp
  team: townsfolk
  firstNight: 0 # 0 = no action, num > 0 => action priority
  firstNightReminder: 无动作
  otherNight: 0
  otherNightReminder: 无动作
  reminders:
    - 标记A
    - 标记B
  remindersGlobal:
    - 标记C
    - 标记D
  setup: false # true if this role affects game setup
  ability: 每局限一次，你可以在白天公开选择一名玩家，如果他是恶魔，他死亡。如果他是镇民，你死亡。

